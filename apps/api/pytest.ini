[pytest]
asyncio_mode = auto
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
# The end-to-end narration test renders a whole film through ffmpeg and takes
# ~90s on its own, so a 90s cap made it fail or pass depending on machine load
# rather than on correctness. The limit exists to kill hangs, and 180s still
# does that.
timeout = 180
