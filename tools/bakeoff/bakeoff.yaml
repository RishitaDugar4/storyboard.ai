# Provider bake-off configuration.
#
# Start small: one economy workhorse, one mid-tier, one premium benchmark.
# Enabling more is a one-line addition -- every key below exists in catalog.py.

output_dir: out
inputs_dir: inputs

# ---------------------------------------------------------------------------
# Models under test. Comment lines back in to widen the matrix.
# ---------------------------------------------------------------------------
models:
  - kling-2.5-turbo-i2v        # ECONOMY  workhorse candidate   $0.07/s
  - hailuo-02-standard-i2v     # ECONOMY  768P, 6s or 10s       $0.045/s
  - hailuo-02-pro-i2v          # STANDARD 1080p, fixed 6s       $0.08/s
  - veo-3.1-standard-i2v       # PREMIUM  benchmark (Gemini, direct)

  # Ready to enable once you want them:
  # - veo-3.1-fast-i2v         # reference images at 1/4 of Veo Standard
  # - wan-2.5-i2v              # cheapest listed        (EXPERIMENTAL)
  # - runway-gen4-turbo-i2v    # Runway-compatible      (EXPERIMENTAL)
  # - luma-ray2-i2v            # Runway-compatible      (EXPERIMENTAL)

# Cap generations per model. The premium benchmark only needs a few samples
# to answer "is it visibly better"; the workhorse needs the full matrix.
sample_limits:
  veo-3.1-standard-i2v: 2

# ---------------------------------------------------------------------------
# Experiment shape
# ---------------------------------------------------------------------------
cases: [static-subtle, push-in, pan, action]
# Authorial intent in seconds. Each model resolves this to its own grid, so the
# same number costs different amounts per model:
#   5s -> Kling            5s     ($0.35)
#      -> Hailuo Standard  6s     ($0.27)  <- rounds UP; 6s is its floor
#      -> Hailuo Pro       6s     ($0.48, fixed)
#      -> Veo              6s     ($2.40)  <- grid is 4/6/8
# Raising this back to 6 pushes Kling onto a 10s clip ($0.70) and changes
# nothing else, since every other model's floor is already 6s.
# Side effect: at 5s Kling's narration budget drops to 10 words (22 at 10s),
# so the longer test cases overflow there too. That is the fit check working.
durations: [5]
repeats: 1                # 2 gives a consistency signal at double the cost
resolution: 1080p
aspect_ratio: "16:9"
seed: 20260825            # applied only where the model supports seeds
motion_language: "Gentle, unhurried camera movement."

# ---------------------------------------------------------------------------
# Money. Two independent controls:
#   budget_usd                    - ceiling for the whole run
#   max_cost_per_generation_usd   - authorization ceiling for ONE generation.
# A generation is refused if its estimate exceeds the per-generation cap, and
# the run is refused if the authorized total exceeds the budget. The estimate
# is never the control -- these caps are.
# ---------------------------------------------------------------------------
budget_usd: 25
max_cost_per_generation_usd: 3.50

max_concurrent:
  fal: 4
  veo: 2
  task_api: 2

# Fake-mode tuning (--fake): divides each model's declared latency, and can
# inject refusals so the error paths get exercised.
fake_speed: 25
fake_failure_rate: 0.0
